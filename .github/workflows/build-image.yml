name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      app_url:
        description: "NEXT_PUBLIC_APP_URL to bake into the client bundle"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  NODE_VERSION: 22.20.0

jobs:
  verify:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15 # maximum execution time

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  build-and-push:
    name: Build and push image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30 # maximum execution time

    # Job-level permissions
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve image name
        id: image #Step ID
        run: echo "name=${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=mktdash-web
            org.opencontainers.image.description=Marketing Dashboard — a shared sending desk with a memory
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: runner
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || false }}
          sbom: ${{ github.event_name != 'pull_request' }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ inputs.app_url || vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### Docker image"
            echo
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Built for validation only — not pushed."
            else
              echo "Pushed to \`${{ env.REGISTRY }}/${{ steps.image.outputs.name }}\`"
            fi
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| Tags | \`${{ join(fromJSON(steps.meta.outputs.json).tags, '`, `') }}\` |"
          } >>"$GITHUB_STEP_SUMMARY"
